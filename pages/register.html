<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Pure CSS implementation -->
        <link rel="stylesheet" href="../styles/register.css">
        <!-- Pure JavaScript implementation -->
        <script src="../js/register.js" defer></script>
        <!-- SweetAlert2 implementation -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <!-- Bootstrap implementation -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
        <title> Registro </title>
    </head>
    <body>

        <main class="d-flex justify-content-center align-items-center vh-100">
            <section>
                <div class="card">
                    <div class="card-body">
                        <h2 class="text-center"> Registro </h2>
                        <hr>
                        <form id="form">
                            <div class="mb-1">
                                <label class="form-label" for="name"> Nombres </label>
                                <input class="form-control" name="name" id="name" type="text">
                            </div>

                            <div class="mb-2">
                                <label class="form-label" for="lastName"> Apellidos </label>
                                <input class="form-control" name="lastName" id="lastName" type="text">
                            </div>

                            <div class="mb-1">
                                <label class="form-label" for="email"> Correo </label>
                                <input class="form-control" name="email" id="email" type="email">
                            </div>

                            <div class="mb-1">
                                <label class="form-label" for="cellphone"> Teléfono </label>
                                <input class="form-control" name="cellphone" id="cellphone" type="number">
                            </div>

                            <div class="mb-1">
                                <label class="form-label" for="password"> Contraseña </label>
                                <input class="form-control" name="password" id="password" type="password">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="role"> Rol </label>
                                <select id="role" class="form-control" name="role" required>
                                    <option value="0" disabled selected="">Seleccione...</option>
                                    <option value="1">Usuario</option>
                                    <option value="2">Admin</option>
                                </select>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-info center center-block"> Registrar </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <p> &copy; Todos los derechos de esta pagina son reservados || StarDevs || 2025 </p>
            <p> Contacto:  </p>
            <p> Ultima modificación: 26/06/2025 </p>
        </footer>
    </body>
</html>
