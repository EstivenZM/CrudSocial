<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Notas Personales</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: rgb(195, 202, 202);}
    .note { padding: 10px; margin-bottom: 10px; max-width: 18rem; border: 2px solid hsl(240, 4%, 19%); border-radius: 10px; 
    background-color: rgb(243, 245, 247);}
 

  </style>
</head>
<body>
  <h1>Notas</h1>

  <textarea id="nueva-nota" placeholder="Escribe una nota..."></textarea><br>
  <button onclick="agregarNota()">Agregar Nota</button>

  <div id="lista-notas"></div>

  <script>
    const currentUser = { name: "luna", role: "admin" };

    function obtenerNotas() {
      return JSON.parse(localStorage.getItem("notas") || "[]");
    }

    function guardarNotas(notas) {
      localStorage.setItem("notas", JSON.stringify(notas));
    }

    function renderizarNotas() {
      const contenedor = document.getElementById("lista-notas");
      contenedor.innerHTML = "";
      const notas = obtenerNotas();
      notas.forEach((nota, index) => {
        if (nota.owner === currentUser.name || currentUser.role === "admin") {
          const div = document.createElement("div");
          div.className = "note";
          div.innerHTML = `
            <p><strong>Propietario:</strong> ${nota.owner}</p>
            <textarea onchange="editarNota(${index}, this.value)">${nota.text}</textarea>
            <br>
            <button onclick="eliminarNota(${index})">Eliminar</button>
          `;
          contenedor.appendChild(div);
        }
      });
    }

    function agregarNota() {
      const texto = document.getElementById("nueva-nota").value;
      if (!texto) return;
      const notas = obtenerNotas();
      notas.push({ text: texto, owner: currentUser.name });
      guardarNotas(notas);
      document.getElementById("nueva-nota").value = "";
      renderizarNotas();
    }

    function editarNota(index, nuevoTexto) {
      const notas = obtenerNotas();
      if (notas[index].owner === currentUser.name || currentUser.role === "admin") {
        notas[index].text = nuevoTexto;
        guardarNotas(notas);
      } else {
        alert("No puedes editar esta nota.");
      }
    }

    function eliminarNota(index) {
      const notas = obtenerNotas();
      if (notas[index].owner === currentUser.name || currentUser.role === "admin") {
        notas.splice(index, 1);
        guardarNotas(notas);
        renderizarNotas();
      } else {
        alert("No puedes eliminar esta nota.");
      }
    }

    renderizarNotas();
  </script>
</body>
</html>
